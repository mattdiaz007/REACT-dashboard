name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py backend_client.py
      - name: Smoke check bundled backend data
        run: |
          python - <<'PY'
          from backend_client import load_backend_health

          frame, source = load_backend_health(use_mock=True)
          assert source == "seed data"
          assert not frame.empty
          PY

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://react-dashboard-prod-93d7964f3cae.herokuapp.com/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Heroku deployment secrets
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_API_KEY" || { echo "Missing HEROKU_API_KEY repository secret"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "Missing HEROKU_APP_NAME repository secret"; exit 1; }

      - name: Deploy to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          printf 'machine git.heroku.com\n  login heroku\n  password %s\n' "$HEROKU_API_KEY" > ~/.netrc
          chmod 600 ~/.netrc
          git remote add heroku "https://git.heroku.com/${HEROKU_APP_NAME}.git"
          git push heroku HEAD:main --force
