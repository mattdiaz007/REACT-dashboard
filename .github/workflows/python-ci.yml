name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py backend_client.py
      - name: Smoke check bundled backend data
        run: |
          python - <<'PY'
          from backend_client import load_backend_health

          frame, source = load_backend_health(use_mock=True)
          assert source == "seed data"
          assert not frame.empty
          PY
